[package]
name = "snes-kit-py"
description = "Python bindings for snes-kit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
snes-kit = { path = "../snes-kit" }
pyo3 = { version = "0.30.1", features = ["extension-module", "abi3-py311"] }
